<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Go Ye Amsterdam – Worship List</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      /* Light warm grey — clear contrast, not white, not dark */
      background: #F0EDE6 !important;
      color: #1a1a1a;
      font-family: 'Source Sans 3', sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #6B4F0A 0%, #9A7010 25%, #C49A14 50%, #9A7010 75%, #6B4F0A 100%);
      padding: 32px 24px 26px;
      text-align: center;
      position: relative;
    }
    header::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(-55deg,
        rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px,
        transparent 1px, transparent 14px);
    }
    header::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 5px;
      background: linear-gradient(90deg, #3D2D04, #C49A14, #F0C840, #C49A14, #3D2D04);
    }
    .church-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(26px, 5.5vw, 46px); font-weight: 700;
      color: #FFF8E7; letter-spacing: 0.07em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.45); position: relative;
    }
    .church-sub {
      font-size: 11px; font-weight: 400; letter-spacing: 0.32em;
      text-transform: uppercase; color: rgba(255,240,190,0.8);
      margin-top: 5px; position: relative;
    }
    .month-pill {
      display: inline-block; margin-top: 14px; padding: 6px 26px;
      background: rgba(0,0,0,0.25); border: 1.5px solid rgba(255,220,100,0.5);
      border-radius: 30px; font-family: 'Cormorant Garamond', serif;
      font-size: 16px; font-weight: 600; color: #FFF0C0;
      letter-spacing: 0.14em; text-transform: uppercase; position: relative;
    }

    /* ── TABS ── */
    .tabs-bar {
      background: #E8E4DC;
      border-bottom: 2px solid #CCC6BA;
      display: flex; justify-content: center;
    }
    .tab-btn {
      padding: 15px 38px; font-family: 'Cormorant Garamond', serif;
      font-size: 17px; font-weight: 600; letter-spacing: 0.04em;
      border: none; background: transparent; color: #999;
      cursor: pointer; border-bottom: 3px solid transparent;
      margin-bottom: -2px; transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn:hover { color: #444; }
    .tab-btn.act-worship { color: #1a5c38; border-bottom-color: #1a5c38; }
    .tab-btn.act-praise  { color: #8b2020; border-bottom-color: #8b2020; }
    .tab-btn.act-solos   { color: #2a4f8a; border-bottom-color: #2a4f8a; }

    /* ── LAYOUT ── */
    .page { max-width: 820px; margin: 0 auto; padding: 28px 20px 90px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .section-head {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px; padding-bottom: 13px;
      border-bottom: 1.5px solid #CCC6BA;
    }
    .section-head h2 {
      font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700;
    }
    .worship-panel .section-head h2 { color: #1a5c38; }
    .praise-panel  .section-head h2 { color: #8b2020; }
    .solos-panel   .section-head h2 { color: #2a4f8a; }
    .section-icon {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
    }
    .worship-panel .section-icon { background: #c8e4d0; border: 1px solid #8ec8a8; }
    .praise-panel  .section-icon { background: #e8cece; border: 1px solid #c09898; }
    .solos-panel   .section-icon { background: #ccd8f0; border: 1px solid #90a8d8; }

    /* ── SONG CARDS ── */
    .songs-table { display: flex; flex-direction: column; gap: 14px; }
    .song-row {
      background: #FAFAF7;
      border: 1px solid #C8C2B4;
      border-radius: 10px; padding: 18px 18px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .row-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .song-num {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px; font-weight: 700; flex-shrink: 0;
    }
    .worship-panel .song-num { background: #c8e4d0; color: #1a5c38; border: 1.5px solid #8ec8a8; }
    .praise-panel  .song-num { background: #e8cece; color: #8b2020; border: 1.5px solid #c09898; }
    .solos-panel   .song-num { background: #ccd8f0; color: #2a4f8a; border: 1.5px solid #90a8d8; }

    .field-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.22em;
      text-transform: uppercase; color: #999; margin-bottom: 5px;
    }
    input[type="text"], input[type="url"] {
      width: 100%; padding: 9px 12px; border: 1.5px solid #C0B8A8;
      border-radius: 7px; font-family: 'Source Sans 3', sans-serif;
      font-size: 14.5px; color: #1a1a1a; background: #F5F2EC;
      transition: border-color 0.18s, background 0.18s; outline: none;
    }
    input:focus { background: #fff !important; }
    .worship-panel input:focus { border-color: #1a5c38 !important; }
    .praise-panel  input:focus { border-color: #8b2020 !important; }
    .solos-panel   input:focus { border-color: #2a4f8a !important; }
    input::placeholder { color: #B0A890; }

    .row-bottom { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
    .yt-wrap { position: relative; }
    .yt-icon {
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%); width: 18px; height: 18px; pointer-events: none;
    }
    .yt-wrap input { padding-left: 34px; }

    .instr-box { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; }
    .instr-box .field-label { text-align: center; }
    .toggle-wrap { display: flex; align-items: center; gap: 8px; }
    .toggle-track {
      width: 46px; height: 26px; border-radius: 13px; background: #C0B8A8;
      position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0;
    }
    .worship-panel .toggle-track.on { background: #1a5c38; }
    .praise-panel  .toggle-track.on { background: #8b2020; }
    .solos-panel   .toggle-track.on { background: #2a4f8a; }
    .toggle-thumb {
      width: 20px; height: 20px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      position: absolute; top: 3px; left: 3px; transition: left 0.2s;
    }
    .toggle-track.on .toggle-thumb { left: 23px; }
    .toggle-label { font-size: 12px; font-weight: 700; color: #999; min-width: 24px; }
    .worship-panel .toggle-track.on ~ .toggle-label { color: #1a5c38; }
    .praise-panel  .toggle-track.on ~ .toggle-label { color: #8b2020; }
    .solos-panel   .toggle-track.on ~ .toggle-label { color: #2a4f8a; }

    .lyrics-toggle-row { margin-top: 11px; }
    .lyrics-toggle-btn {
      font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      background: #E8E4DC; border: 1px solid #C8C2B4; border-radius: 20px;
      padding: 4px 14px; cursor: pointer; color: #999; transition: all 0.18s;
    }
    .lyrics-toggle-btn:hover { background: #DDD8CE; color: #444; }
    .worship-panel .lyrics-toggle-btn.open { background: #c8e4d0; color: #1a5c38; border-color: #8ec8a8; }
    .praise-panel  .lyrics-toggle-btn.open { background: #e8cece; color: #8b2020; border-color: #c09898; }
    .solos-panel   .lyrics-toggle-btn.open { background: #ccd8f0; color: #2a4f8a; border-color: #90a8d8; }

    .lyrics-area { display: none; margin-top: 10px; }
    .lyrics-area.open { display: block; }
    .lyrics-area textarea {
      width: 100%; min-height: 130px; padding: 10px 12px;
      border: 1.5px solid #C0B8A8; border-radius: 7px;
      font-family: 'Source Sans 3', sans-serif; font-size: 13.5px;
      line-height: 1.78; color: #2a2a2a; background: #F5F2EC;
      resize: vertical; outline: none; transition: border-color 0.18s;
    }
    .worship-panel .lyrics-area textarea:focus { border-color: #1a5c38; }
    .praise-panel  .lyrics-area textarea:focus { border-color: #8b2020; }
    .solos-panel   .lyrics-area textarea:focus { border-color: #2a4f8a; }
    .lyrics-area textarea::placeholder { color: #B0A890; }

    /* ── EXPORT BAR ── */
    .export-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #E8E4DC; border-top: 2px solid #CCC6BA;
      padding: 13px 24px; display: flex;
      justify-content: flex-end; align-items: center; gap: 12px;
      z-index: 100; box-shadow: 0 -3px 14px rgba(0,0,0,0.10);
    }
    .export-hint { font-size: 12.5px; color: #888; margin-right: auto; font-weight: 600; }
    .btn-export {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 26px;
      background: linear-gradient(135deg, #6B4F0A, #9A7010, #C49A14);
      color: #FFF8E7; font-family: 'Source Sans 3', sans-serif;
      font-size: 13px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
      border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 2px 10px rgba(80,55,0,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-export:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(80,55,0,0.45); }
    .btn-export:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>

<header>
  <div class="church-name">Go Ye Amsterdam</div>
  <div class="church-sub">Worship Department &nbsp;·&nbsp; Song Database</div>
  <div class="month-pill">May 2026</div>
</header>

<div class="tabs-bar">
  <button class="tab-btn act-worship" id="btn-worship" onclick="switchTab('worship')">🕊 Worship</button>
  <button class="tab-btn" id="btn-praise" onclick="switchTab('praise')">🎺 Praise</button>
  <button class="tab-btn" id="btn-solos" onclick="switchTab('solos')">🎤 Solos</button>
</div>

<div class="page">
  <div id="panel-worship" class="tab-panel worship-panel active">
    <div class="section-head">
      <div class="section-icon">🕊</div>
      <h2>Worship Songs — May 2026</h2>
    </div>
    <div class="songs-table" id="worship-rows"></div>
  </div>
  <div id="panel-praise" class="tab-panel praise-panel">
    <div class="section-head">
      <div class="section-icon">🎺</div>
      <h2>Praise Songs — May 2026</h2>
    </div>
    <div class="songs-table" id="praise-rows"></div>
  </div>
  <div id="panel-solos" class="tab-panel solos-panel">
    <div class="section-head">
      <div class="section-icon">🎤</div>
      <h2>Solos — May 2026</h2>
    </div>
    <div class="songs-table" id="solos-rows"></div>
  </div>
</div>

<div class="export-bar">
  <span class="export-hint">Fill in your songs, then export for your team</span>
  <button class="btn-export" id="exportBtn" onclick="exportPDF()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="11" x2="12" y2="17"/><polyline points="9 14 12 17 15 14"/></svg>
    Export as PDF
  </button>
</div>

<script>
const YT_SVG = `<svg class="yt-icon" viewBox="0 0 24 24" fill="#FF0000"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.75 15.5V8.5l6.25 3.5-6.25 3.5z"/></svg>`;

function buildRows(count, containerId) {
  const el = document.getElementById(containerId);
  let html = '';
  for (let i = 1; i <= count; i++) {
    const id = containerId + '-' + i;
    html += `
    <div class="song-row">
      <div class="row-top">
        <div class="song-num">${i}</div>
        <div style="flex:1">
          <div class="field-label">Song Title</div>
          <input type="text" id="title-${id}" placeholder="Enter song title…" autocomplete="off"/>
        </div>
      </div>
      <div class="row-bottom">
        <div>
          <div class="field-label">YouTube Link</div>
          <div class="yt-wrap">
            ${YT_SVG}
            <input type="url" id="yt-${id}" placeholder="https://www.youtube.com/watch?v=…"/>
          </div>
        </div>
        <div class="instr-box">
          <div class="field-label">Instrumental</div>
          <div class="toggle-wrap">
            <div class="toggle-track" id="track-${id}" onclick="flipToggle('${id}')">
              <div class="toggle-thumb"></div>
            </div>
            <span class="toggle-label" id="tlabel-${id}">No</span>
          </div>
        </div>
      </div>
      <div class="lyrics-toggle-row">
        <button class="lyrics-toggle-btn" id="lbtn-${id}" onclick="toggleLyrics('${id}')">+ Add Lyrics</button>
      </div>
      <div class="lyrics-area" id="lyrics-${id}">
        <div class="field-label" style="margin-bottom:6px">Lyrics</div>
        <textarea placeholder="Paste or type lyrics here…&#10;&#10;Verse 1&#10;…&#10;&#10;Chorus&#10;…&#10;&#10;Bridge&#10;…"></textarea>
      </div>
    </div>`;
  }
  el.innerHTML = html;
}

function flipToggle(id) {
  const track = document.getElementById('track-' + id);
  const label = document.getElementById('tlabel-' + id);
  track.classList.toggle('on');
  label.textContent = track.classList.contains('on') ? 'Yes' : 'No';
}

function toggleLyrics(id) {
  const area = document.getElementById('lyrics-' + id);
  const btn  = document.getElementById('lbtn-' + id);
  area.classList.toggle('open');
  btn.classList.toggle('open');
  btn.textContent = area.classList.contains('open') ? '− Hide Lyrics' : '+ Add Lyrics';
}

function switchTab(tab) {
  ['worship','praise','solos'].forEach(t => {
    document.getElementById('panel-' + t).classList.remove('active');
    document.getElementById('btn-' + t).className = 'tab-btn';
  });
  document.getElementById('panel-' + tab).classList.add('active');
  document.getElementById('btn-' + tab).className = 'tab-btn act-' + tab;
}

// ── PDF EXPORT ────────────────────────────────────────────────────────────────
function collectData() {
  const sections = [
    { label: 'WORSHIP SONGS — MAY 2026', color: [26,92,56],   containerId: 'worship-rows', count: 4 },
    { label: 'PRAISE SONGS — MAY 2026',  color: [139,32,32],  containerId: 'praise-rows',  count: 4 },
    { label: 'SOLOS — MAY 2026',         color: [42,79,138],  containerId: 'solos-rows',   count: 4 },
  ];
  return sections.map(sec => {
    const songs = [];
    for (let i = 1; i <= sec.count; i++) {
      const id    = sec.containerId + '-' + i;
      const title = (document.getElementById('title-' + id)?.value || '').trim();
      const yt    = (document.getElementById('yt-' + id)?.value    || '').trim();
      const instr = document.getElementById('track-' + id)?.classList.contains('on');
      const lyrEl = document.querySelector('#lyrics-' + id + ' textarea');
      const lyrics = (lyrEl?.value || '').trim();
      songs.push({ num: i, title, yt, instr, lyrics });
    }
    return { label: sec.label, color: sec.color, songs };
  });
}

async function exportPDF() {
  const btn = document.getElementById('exportBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Generating…';

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const PW = 210, PH = 297, ML = 16, MR = 16;
    const CW = PW - ML - MR;
    let y = 0;

    function needSpace(h) {
      if (y + h > PH - 16) {
        doc.addPage();
        y = 20;
      }
    }

    // ── Gold header (every page gets it via template — we do page 1 manually)
    function drawHeader() {
      // gradient simulation: three rects
      doc.setFillColor(107, 79, 10);  doc.rect(0, 0, PW, 38, 'F');
      doc.setFillColor(154, 112, 16); doc.rect(PW*0.12, 0, PW*0.76, 38, 'F');
      doc.setFillColor(196, 154, 20); doc.rect(PW*0.25, 0, PW*0.5, 38, 'F');
      // bottom line
      doc.setFillColor(240, 200, 64); doc.rect(0, 37, PW, 1.5, 'F');
      // Church name
      doc.setFont('helvetica', 'bold'); doc.setFontSize(22);
      doc.setTextColor(255, 248, 231);
      doc.text('Go Ye Amsterdam', PW/2, 16, { align: 'center' });
      // Subtitle
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
      doc.setTextColor(255, 240, 190);
      doc.text('WORSHIP DEPARTMENT  ·  SONG DATABASE', PW/2, 23, { align: 'center' });
      // Month pill bg
      doc.setFillColor(0, 0, 0); doc.setGState(doc.GState({ opacity: 0.28 }));
      doc.roundedRect(PW/2 - 18, 27, 36, 8, 4, 4, 'F');
      doc.setGState(doc.GState({ opacity: 1 }));
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5);
      doc.setTextColor(255, 240, 190);
      doc.text('MAY 2026', PW/2, 32.5, { align: 'center' });
      y = 48;
    }

    drawHeader();

    const data = collectData();

    data.forEach((section, si) => {
      // Section break — new page after worship
      if (si > 0) { doc.addPage(); drawHeader(); }

      const [r,g,b] = section.color;

      // Section heading
      needSpace(14);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
      doc.setTextColor(r, g, b);
      doc.text(section.label, ML, y);
      doc.setDrawColor(r, g, b); doc.setLineWidth(0.5);
      doc.line(ML, y+2, PW-MR, y+2);
      y += 10;

      section.songs.forEach(song => {
        // Estimate card height
        const hasLyrics = song.lyrics.length > 0;
        const lyrLines = hasLyrics ? doc.splitTextToSize(song.lyrics, CW - 8).length : 0;
        const cardH = 10 + 8 + (song.yt ? 7 : 6) + (hasLyrics ? 5 + lyrLines * 5 : 0) + 6;

        needSpace(cardH + 4);
        const cardY = y;

        // Card background
        doc.setFillColor(250, 250, 247);
        doc.setDrawColor(200, 194, 180); doc.setLineWidth(0.3);
        doc.roundedRect(ML, cardY, CW, cardH, 2.5, 2.5, 'FD');

        // Number circle
        doc.setFillColor(r, g, b);
        doc.circle(ML + 6, cardY + 7, 4.8, 'F');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
        doc.setTextColor(255, 255, 255);
        doc.text(String(song.num), ML + 6, cardY + 9, { align: 'center' });

        // Song title
        doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
        doc.setTextColor(26, 26, 26);
        const title = song.title || '(No title entered)';
        doc.text(title, ML + 14, cardY + 9);

        // Instrumental badge (right aligned)
        const instrLabel = song.instr ? 'Instrumental: YES' : 'Instrumental: NO';
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
        doc.setTextColor(song.instr ? r : 120, song.instr ? g : 112, song.instr ? b : 100);
        doc.text(instrLabel, PW - MR - 2, cardY + 9, { align: 'right' });

        let cy = cardY + 16;

        // YouTube link — CLICKABLE
        if (song.yt) {
          // Red YT label
          doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
          doc.setTextColor(220, 0, 0);
          doc.text('▶ YouTube:', ML + 3, cy);
          // Blue clickable link
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(40, 80, 180);
          const ytDisplay = song.yt.length > 60 ? song.yt.substring(0, 57) + '…' : song.yt;
          // textWithLink makes it a real clickable hyperlink in the PDF
          doc.textWithLink(ytDisplay, ML + 28, cy, { url: song.yt });
          // Underline the link
          const linkW = doc.getTextWidth(ytDisplay);
          doc.setDrawColor(40, 80, 180); doc.setLineWidth(0.2);
          doc.line(ML + 28, cy + 0.8, ML + 28 + linkW, cy + 0.8);
          cy += 7;
        } else {
          doc.setFont('helvetica', 'italic'); doc.setFontSize(8);
          doc.setTextColor(180, 170, 155);
          doc.text('No YouTube link added', ML + 3, cy);
          cy += 6;
        }

        // Lyrics
        if (hasLyrics) {
          doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5);
          doc.setTextColor(r, g, b);
          doc.text('LYRICS', ML + 3, cy);
          cy += 4;
          doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
          doc.setTextColor(50, 50, 50);
          const lines = doc.splitTextToSize(song.lyrics, CW - 8);
          lines.forEach(line => {
            if (cy > PH - 20) { doc.addPage(); drawHeader(); cy = y; }
            doc.text(line, ML + 3, cy);
            cy += 4.8;
          });
        }

        y = cy + 8;
      });
    });

    // Footer on every page
    const total = doc.internal.getNumberOfPages();
    for (let p = 1; p <= total; p++) {
      doc.setPage(p);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
      doc.setTextColor(180, 170, 155);
      doc.text('© 2026 Go Ye Amsterdam — Worship List', ML, PH - 7);
